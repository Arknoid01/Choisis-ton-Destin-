<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bibliothèque</title>
<script src="capacitor.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; background:#0d0d0f; color:#e8e0d0; font-family:'Cormorant Garamond',serif; overflow-x:hidden; }

:root {
  --android-safe-area-inset-top: 36px;
  --gold:   #c8a96e;
  --gold2:  #e8d4a0;
  --gold3:  #8a6a30;
  --cream:  #e8e0d0;
  --dim:    #9a8a70;
  --dimmer: #5a5040;
  --bg:     #0d0d0f;
  --bg2:    #13110e;
  --bg3:    #1a1710;
  --border: #2a2418;
}

/* ── BACKGROUND ── */
.bg-gradient {
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(200,169,110,0.05) 0%, transparent 70%),
    linear-gradient(180deg, #0d0d0f 0%, #13110e 100%);
}

/* ── TOPBAR ── */
#topbar {
  position:fixed; top:0; left:0; right:0;
  height:calc(54px + var(--android-safe-area-inset-top, 0px));
  padding-top:var(--android-safe-area-inset-top, 0px);
  background:rgba(13,13,15,0.9); border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px); z-index:100;
  display:flex; align-items:center; gap:12px; padding-left:16px; padding-right:16px;
}
#btn-back {
  width:36px; height:36px; border-radius:8px;
  border:1px solid var(--border); background:none;
  color:var(--dim); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .15s; text-decoration:none; flex-shrink:0;
}
#btn-back:hover { border-color:var(--gold3); color:var(--cream); }
.topbar-title {
  font-family:'Cinzel',serif; font-size:14px; font-weight:600;
  color:var(--cream); letter-spacing:2px; flex:1;
}
#btn-community {
  width:36px;height:36px;border-radius:8px;
  border:1px solid var(--border);background:none;
  color:var(--dim);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
}
#btn-community:hover { border-color:var(--gold3);color:var(--gold); }

#billing-diag-overlay {
  display:none; position:fixed; inset:0; z-index:950;
  background:rgba(0,0,0,0.75); align-items:center; justify-content:center; padding:16px;
}
#billing-diag-overlay.open { display:flex; }
#billing-diag-box {
  background:#1a1710; border:1px solid #3a3222; border-radius:12px;
  max-width:420px; width:100%; max-height:80vh; overflow:auto; padding:18px;
}
#billing-diag-box h3 {
  font-family:'Cinzel',serif; font-size:14px; color:var(--gold); margin:0 0 12px;
  letter-spacing:1px;
}
#billing-diag-lines { font-size:12px; line-height:1.6; color:#c8b89a; white-space:pre-wrap; }
#billing-diag-close {
  margin-top:14px; width:100%; padding:10px; border-radius:8px;
  border:1px solid #3a3222; background:none; color:#9a8a70; cursor:pointer;
  font-family:Lato,sans-serif; font-size:12px;
}

/* ── SCROLL AREA ── */
#scroll {
  position:fixed; top:calc(54px + var(--android-safe-area-inset-top, 0px)); left:0; right:0; bottom:0;
  overflow-y:auto; z-index:10;
}
#scroll::-webkit-scrollbar { width:3px; }
#scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

/* ── CONTENT ── */
#content { max-width:520px; margin:0 auto; padding:20px 16px 60px; }

/* ── KIDS BANNER ── */
.kids-banner {
  background:linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,160,0,0.05));
  border:1px solid rgba(255,215,0,0.2); border-radius:14px;
  padding:14px 16px; margin-bottom:8px;
  display:flex; align-items:center; gap:12px;
}
.kids-banner-icon { font-size:28px; flex-shrink:0; }
.kids-banner-text { flex:1; }
.kids-banner-title {
  font-family:'Cinzel',serif; font-size:13px; font-weight:600;
  color:#ffd700; letter-spacing:1px; margin-bottom:2px;
}
.kids-banner-sub { font-size:12px; color:var(--dim); font-style:italic; }

/* ── STARTER BANNER (nouveaux lecteurs) ── */
.starter-banner {
  background:linear-gradient(135deg, rgba(200,169,110,0.1), rgba(200,169,110,0.03));
  border:1px solid rgba(200,169,110,0.22); border-radius:14px;
  padding:16px; margin-bottom:20px; cursor:pointer;
  transition:border-color .2s, background .2s;
}
.starter-banner:hover {
  border-color:rgba(200,169,110,0.4);
  background:linear-gradient(135deg, rgba(200,169,110,0.14), rgba(200,169,110,0.05));
}
.starter-label {
  font-family:'Lato',sans-serif; font-size:10px; letter-spacing:2px;
  text-transform:uppercase; color:var(--gold); margin-bottom:6px;
}
.starter-title {
  font-family:'Cinzel',serif; font-size:15px; font-weight:600;
  color:var(--cream); letter-spacing:1px; margin-bottom:4px;
}
.starter-sub { font-size:13px; color:var(--dim); font-style:italic; line-height:1.5; margin-bottom:12px; }
.starter-row { display:flex; align-items:center; gap:12px; }
.starter-icon { font-size:28px; flex-shrink:0; }
.starter-btn {
  display:inline-block; padding:8px 14px; border-radius:8px;
  border:1px solid rgba(200,169,110,0.35); color:var(--gold2);
  font-family:'Cinzel',serif; font-size:11px; letter-spacing:1.5px;
}

.kids-free-badge {
  background:#ffd70022; border:1px solid #ffd70044;
  border-radius:20px; padding:4px 10px;
  font-family:'Lato',sans-serif; font-size:10px;
  font-weight:700; color:#ffd700; letter-spacing:1px;
  flex-shrink:0;
}

/* ── PACK SECTION ── */
.pack-section { margin-bottom:28px; animation:fade-up .4s ease; }

.pack-header {
  display:flex; align-items:center; gap:12px;
  padding:14px 16px; border-radius:14px;
  background:var(--bg3); border:1px solid var(--border);
  position:relative; overflow:hidden;
  cursor:pointer; user-select:none;
  transition:border-radius .2s;
}
.pack-section:not(.collapsed) .pack-header {
  border-radius:14px 14px 0 0;
  border-bottom:none;
}
.pack-header::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, var(--pack-color, rgba(200,169,110,0.08)), transparent);
}
.pack-toggle {
  font-size:18px; color:var(--dim); flex-shrink:0; position:relative;
  transition:transform .25s ease; line-height:1;
}
.pack-section:not(.collapsed) .pack-toggle { transform:rotate(90deg); }
.pack-body { display:block; }
.pack-section.collapsed .pack-body { display:none; }
.pack-collapsed-hint { color:var(--gold2); font-style:normal; opacity:0.85; }

.pack-reveal-item {
  opacity:0;
  animation:fade-up .45s ease both;
  animation-delay:calc(var(--reveal-i, 0) * 0.07s);
}
.pack-icon { font-size:24px; flex-shrink:0; position:relative; }
.pack-info { flex:1; position:relative; }
.pack-name {
  font-family:'Cinzel',serif; font-size:14px; font-weight:600;
  color:var(--cream); letter-spacing:1px;
}
.pack-meta {
  font-size:11px; color:var(--dim); margin-top:2px;
  font-family:'Lato',sans-serif;
}
.pack-count {
  background:rgba(255,255,255,0.06); border:1px solid var(--border);
  border-radius:20px; padding:4px 10px;
  font-family:'Lato',sans-serif; font-size:11px;
  color:var(--dim); position:relative; flex-shrink:0;
}
.pack-count strong { color:var(--cream); }

/* PACK PRICE BADGE */
.pack-price {
  font-family:'Cinzel',serif; font-size:12px; font-weight:600;
  padding:6px 14px; border-radius:20px; flex-shrink:0;
  position:relative; cursor:pointer; transition:all .2s;
  border:1px solid var(--pack-color, var(--gold3));
  color:var(--pack-color, var(--gold2));
  background:color-mix(in srgb, var(--pack-color, var(--gold3)) 12%, transparent);
}
.pack-price:hover { transform:scale(1.05); }
.pack-price.free {
  border-color:rgba(255,215,0,0.4); color:#ffd700;
  background:rgba(255,215,0,0.08);
}
.pack-price.locked {
  filter:grayscale(0.3);
}
.pack-price.soon {
  cursor:default; filter:none;
  border-color:rgba(200,169,110,0.35); color:var(--gold2);
  background:rgba(200,169,110,0.1); letter-spacing:0.5px;
}
.pack-price.soon:hover { transform:none; }
.pack-soon-bar {
  background:rgba(200,169,110,0.06); border:1px solid var(--border);
  border-top:none; border-radius:0 0 14px 14px;
  padding:14px 16px; text-align:center;
  font-family:'Lato',sans-serif; font-size:12px; color:var(--dim);
  line-height:1.5;
}
.pack-soon-bar strong { color:var(--gold2); font-weight:600; }

/* LOCK OVERLAY ON PACK */
.pack-locked-bar {
  background:rgba(0,0,0,0.4); border:1px solid var(--border);
  border-top:none; border-radius:0 0 14px 14px;
  padding:10px 16px; display:flex; align-items:center; gap:8px;
  font-family:'Lato',sans-serif; font-size:11px; color:var(--dimmer);
  letter-spacing:1px;
}
.pack-locked-bar .lock-icon { font-size:14px; }

.pack-portal-hook {
  background:rgba(100,180,255,0.04); border:1px solid var(--border);
  border-top:none; padding:10px 16px 12px;
  font-family:'Cormorant Garamond',serif; font-size:13px;
  color:var(--text3); font-style:italic; line-height:1.55;
}

/* ── STORY CARDS ── */
.stories-list {
  border:1px solid var(--border); border-top:none;
  border-radius:0 0 14px 14px; overflow:hidden;
}

.story-card {
  display:flex; align-items:center; gap:14px;
  padding:14px 16px; background:var(--bg2);
  border-bottom:1px solid var(--border);
  cursor:pointer; transition:all .2s; position:relative;
}
.story-card:last-child { border-bottom:none; border-radius:0 0 14px 14px; }
.story-card:hover { background:color-mix(in srgb, var(--pack-color, var(--gold3)) 5%, var(--bg2)); }
.story-card:hover .story-arrow { transform:translateX(3px); }

.story-card.locked {
  cursor:default; opacity:0.55;
  pointer-events:none;
}

.story-icon {
  width:44px; height:44px; border-radius:10px;
  background:var(--bg3); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:22px; flex-shrink:0;
}
.story-info { flex:1; min-width:0; }
.story-title {
  font-family:'Cinzel',serif; font-size:13px; font-weight:600;
  color:var(--cream); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.story-desc {
  font-size:12px; color:var(--dim);
  font-style:italic; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.story-meta {
  display:flex; gap:6px; margin-top:4px; flex-wrap:wrap;
}
.story-tag {
  font-family:'Lato',sans-serif; font-size:9px;
  letter-spacing:1px; padding:2px 6px; border-radius:20px;
  border:1px solid var(--border); color:var(--dimmer);
  text-transform:uppercase;
}
.story-tag.kids { border-color:rgba(255,215,0,0.3); color:#ffd700; }
.story-tag.new  { border-color:rgba(100,220,150,0.3); color:#64dc96; }
.story-tag.community {
  border-color:rgba(124,109,250,0.45); color:#b8a8ff;
  background:rgba(124,109,250,0.1);
}
.story-tag.portal {
  background:rgba(155,93,229,0.15); color:#c084fc; border-color:rgba(155,93,229,0.4);
}
.story-author {
  font-size:11px; color:#b8a8ff; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ══════════════════════════════════════════════
   VUE RAYONS (bibliothèque) — ajoutée en plus de la vue liste
   ══════════════════════════════════════════════ */
:root { --wood:#3a2818; --wood-dark:#241609; }

.view-toggle {
  display:flex; align-items:center; justify-content:center; gap:6px;
  margin:0 0 14px; padding:9px; border-radius:10px;
  border:1px solid var(--border); background:var(--bg3);
  font-family:'Lato',sans-serif; font-size:10.5px; letter-spacing:1px;
  color:var(--dim); cursor:pointer; text-transform:uppercase;
}
.view-toggle:active { border-color:var(--gold3); color:var(--cream); }

.onboard-tip {
  position:relative; margin:0 0 16px; padding:12px 14px;
  background:linear-gradient(135deg, rgba(200,169,110,0.12), rgba(124,109,250,0.06));
  border:1px solid var(--gold3); border-radius:12px;
}
.onboard-tip::before {
  content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:8px solid transparent; border-right:8px solid transparent;
  border-bottom:8px solid var(--gold3);
}
.onboard-tip::after {
  content:''; position:absolute; top:-6.5px; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent;
  border-bottom:7px solid #1c1810;
}
.onboard-tip-text { font-family:'Lato',sans-serif; font-size:11.5px; color:var(--cream); line-height:1.5; }
.onboard-tip-row { display:flex; align-items:center; gap:7px; margin-top:10px; }
.onboard-tip-row input { accent-color:var(--gold); width:14px; height:14px; }
.onboard-tip-row label { font-family:'Lato',sans-serif; font-size:10px; color:var(--dim); cursor:pointer; }
.onboard-tip-close { position:absolute; top:8px; right:10px; font-size:13px; color:var(--dim); cursor:pointer; }

.shelf-block { margin-bottom:10px; }
.shelf-block-header { display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px; margin-bottom:6px; }
.shelf-block-header-main { display:flex; align-items:center; gap:7px; }
.shelf-block-icon { font-size:16px; }
.shelf-block-name { font-family:'Cinzel',serif; font-size:12.5px; font-weight:600; color:var(--gold2); letter-spacing:0.5px; }
.shelf-block-price {
  font-family:'Lato',sans-serif; font-size:8px; letter-spacing:1px;
  padding:2px 8px; border-radius:20px; border:1px solid var(--border); color:var(--dimmer);
}
.shelf-block-price.free { color:#64dc96; border-color:rgba(100,220,150,0.3); }
.shelf-block-price.soon { color:var(--gold2); border-color:var(--gold3); }

.bookcase-row {
  display:flex; flex-wrap:nowrap; align-items:flex-end; justify-content:flex-start;
  gap:8px; padding:48px 10px 6px;
  min-height:210px; overflow-x:auto; overflow-y:visible;
  scroll-behavior:smooth; scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.bookcase-row::-webkit-scrollbar { height:5px; }
.bookcase-row::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
.bookcase-row::-webkit-scrollbar-track { background:transparent; }

.shelf-plank {
  height:10px; margin:0 4px 18px;
  background:linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
  border-radius:2px; box-shadow:0 3px 6px rgba(0,0,0,0.5);
}

.book {
  flex-shrink:0; width:auto; min-width:38px; height:176px; border-radius:3px 6px 6px 3px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:12px 6px 10px; cursor:pointer; position:relative;
  box-shadow:
    inset -4px 0 7px rgba(0,0,0,0.4),
    inset 0 2px 0 rgba(255,255,255,0.12),
    inset 0 -2px 0 rgba(0,0,0,0.35),
    1px 2px 5px rgba(0,0,0,0.45);
  border:1px solid rgba(0,0,0,0.35); border-right:2px solid rgba(0,0,0,0.3);
  transition:transform .48s cubic-bezier(.22,1,.36,1), box-shadow .48s ease, opacity .32s ease;
  transform-origin:bottom center;
  scroll-snap-align:center;
}
.book::before {
  content:''; position:absolute; top:8px; bottom:8px; left:4px; width:1px;
  background:rgba(255,255,255,0.1);
}
.book:active { transform:scale(1.03) translateY(-2px); }
.book.selected {
  transform:scale(1.2) translateY(-12px);
  z-index:50;
  box-shadow:
    inset -4px 0 7px rgba(0,0,0,0.4),
    inset 0 2px 0 rgba(255,255,255,0.12),
    inset 0 -2px 0 rgba(0,0,0,0.35),
    0 12px 26px rgba(0,0,0,0.55), 0 0 0 2px var(--gold);
}
.book.locked { opacity:0.45; }
.book.locked.selected { opacity:0.85; }
.book-icon { font-size:14px; margin-bottom:5px; flex-shrink:0; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
.book-title {
  writing-mode:vertical-rl; text-orientation:mixed; transform:rotate(180deg);
  font-family:'Cinzel',serif; font-size:12.5px; font-weight:600;
  color:rgba(255,255,255,0.92); letter-spacing:0.3px; line-height:1.15;
  text-shadow:0 1px 2px rgba(0,0,0,0.4);
  white-space:normal; word-break:keep-all;
  flex:1; max-height:100%; overflow:hidden;
  display:flex; align-items:center; justify-content:center; gap:3px;
}
.book-community-dot {
  position:absolute; top:5px; right:4px; width:6px; height:6px; border-radius:50%;
  background:#b8a8ff; box-shadow:0 0 4px #b8a8ff;
}
.book-lock { flex-shrink:0; margin-top:4px; font-size:11px; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }

.tone-free   { background:linear-gradient(100deg,#6b5230,#8a6a30); }
.tone-kids   { background:linear-gradient(100deg,#5a4a7a,#7c6da0); }
.tone-lames  { background:linear-gradient(100deg,#7a2a2a,#a03838); }
.tone-cosmos { background:linear-gradient(100deg,#1e3a5a,#2c5a8a); }
.tone-neon   { background:linear-gradient(100deg,#1e5a4a,#2c8a6a); }
.tone-pirates{ background:linear-gradient(100deg,#5a4020,#8a6030); }
.tone-fantasy{ background:linear-gradient(100deg,#4a2a5a,#6a3a8a); }
.tone-wilds  { background:linear-gradient(100deg,#3a5a2a,#5a8a3a); }
.tone-soon   { background:repeating-linear-gradient(135deg,#2a2418,#2a2418 4px,#332c1c 4px,#332c1c 8px); }
.tone-bookmarks { background:linear-gradient(100deg,#2a6b4a,#3a9a68); }

.shelf-soon-msg {
  padding:14px; background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  text-align:center; font-family:'Lato',sans-serif; font-size:10px; color:var(--dim);
}

/* Bulle info sur le livre cliqué */
.book-popover {
  display:none; position:fixed; left:16px; right:16px; bottom:16px;
  background:var(--bg3); border:1px solid var(--gold3); border-radius:14px;
  padding:16px; z-index:200; box-shadow:0 -8px 30px rgba(0,0,0,0.6);
  animation:popIn .32s cubic-bezier(.22,1,.36,1); max-width:520px; margin:0 auto;
}
.book-popover.open { display:block; }
@keyframes popIn { from{ transform:translateY(16px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
.popover-backdrop.open { display:block; animation:backdropIn .28s ease-out; }
@keyframes backdropIn { from{ opacity:0; } to{ opacity:1; } }
.popover-backdrop {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:199;
  transition:opacity .28s ease;
}
.popover-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.popover-icon {
  width:38px; height:38px; border-radius:9px; background:var(--bg);
  border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
  font-size:19px; flex-shrink:0;
}
.popover-title { font-family:'Cinzel',serif; font-size:14px; font-weight:600; color:var(--cream); line-height:1.25; }
.popover-author { font-family:'Lato',sans-serif; font-size:10px; color:#b8a8ff; margin-top:2px; }
.popover-desc { font-size:13px; color:var(--dim); font-style:italic; line-height:1.5; margin-bottom:14px; }
.popover-actions { display:flex; gap:8px; }
.popover-btn {
  flex:1; text-align:center; font-family:'Lato',sans-serif; font-size:11px; letter-spacing:1px;
  padding:11px; border-radius:9px; text-transform:uppercase; cursor:pointer;
}
.popover-btn.play { background:var(--gold); color:#1a1408; font-weight:700; }
.popover-btn.close { background:none; border:1px solid var(--border); color:var(--dim); flex:0 0 44px; }

/* ── COMMUNITY SPOTLIGHT ── */
.community-spotlight {
  margin-bottom:18px; padding:16px;
  border:1px solid rgba(124,109,250,0.35);
  border-radius:14px;

<script>
// ══════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════
const PACK_CONFIG = {

  },

    },
    order: 7
  }
};

const PORTAL_PACK_HOOK = {
  fr: 'Enquête multi-chapitres — vos choix dans un chapitre influencent les autres.',
  en: 'Multi-chapter investigation — choices in one chapter affect the others.',
  es: 'Investigación multi-capitular — tus elecciones en un capítulo influyen en los demás.'
};

const PACK_UI = {
  fr: {
    free: 'GRATUIT',
    unlocked: '✓ Débloqué',
    soon: 'BIENTÔT',
    bookmark: n => `${n} marque-page${n > 1 ? 's' : ''}`,
    tapToExpand: n => `Toucher pour voir ${n} histoire${n > 1 ? 's' : ''}`,
    available: (n, label) => `${label} disponible${n > 1 ? 's' : ''}`
  },
  en: {
    free: 'FREE',
    unlocked: '✓ Unlocked',
    soon: 'COMING SOON',
    bookmark: n => `${n} bookmark${n > 1 ? 's' : ''}`,
    tapToExpand: n => `Tap to see ${n} stor${n > 1 ? 'ies' : 'y'}`,
    available: (n, label) => `${label} available`
  },
  es: {
    free: 'GRATIS',
    unlocked: '✓ Desbloqueado',
    soon: 'PRÓXIMAMENTE',
    bookmark: n => `${n} marcador${n > 1 ? 'es' : ''}`,
    tapToExpand: n => `Toca para ver ${n} historia${n > 1 ? 's' : ''}`,
    available: (n, label) => `${label} disponible${n > 1 ? 's' : ''}`
  }
};

function packUi(lang) {
  return PACK_UI[lang] || PACK_UI.fr;
}

// Histoire recommandée — voir sf-shared.js (SFShared)
const STARTER_TXT = {
  fr: { label:'Nouveau ici ?', title:'Commencez par ici', sub:'~15 min, gratuite — vos choix comptent.', btn:'Lancer l\'histoire' },
  en: { label:'New here?', title:'Start here', sub:'~15 min, free — your choices matter.', btn:'Start the story' },
  es: { label:'¿Nuevo aquí?', title:'Empieza aquí', sub:'~15 min, gratis — tus elecciones importan.', btn:'Empezar la historia' }
};

function getStarterStoryFile(kidsOnly) {
  if (window.SFShared) return SFShared.getStarterFile(currentLang);
  return 'stories/fr/lumiere_peur_du_noir.json';
}

// Packs déverrouillés — source de vérité : Google Play via SFBilling.
// Le module maintient le cache localStorage 'sf_unlocked_packs'.
function getUnlockedPacks() {
  if (window.SFBilling) return SFBilling.getUnlockedPacks();
  try {
    return JSON.parse(localStorage.getItem('sf_unlocked_packs') || '["free","kids"]');
  } catch { return ['free','kids']; }
}

let currentLang = localStorage.getItem('sf_lang') || 'fr';
if (!['fr','en','es'].includes(currentLang)) currentLang = 'fr';
let allGames = [];

// ══════════════════════════════════════════════
// LOAD
// ══════════════════════════════════════════════
function scrollToPackHash() {
  const hash = location.hash;
  if (!hash || !hash.startsWith('#pack-')) return;
  const packId = hash.slice(6);
  if (getLibraryViewMode() === 'list') {
    expandPackSection(packId);
    requestAnimationFrame(() => {
      const el = document.querySelector(hash);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  } else {
    requestAnimationFrame(() => {
      const el = document.getElementById('shelf-' + packId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
}

function getExpandedPacks() {
  try {
    return new Set(JSON.parse(localStorage.getItem('sf_pack_expanded') || '[]'));
  } catch { return new Set(); }
}

function setExpandedPacks(set) {
  try { localStorage.setItem('sf_pack_expanded', JSON.stringify([...set])); } catch (e) {}
}

function isPackExpanded(packId) {
  return getExpandedPacks().has(packId);
}

function applyPackCollapse(packId, expanded, animateReveal) {
  const el = document.getElementById('pack-' + packId);
  if (!el) return;
  el.classList.toggle('collapsed', !expanded);
  const header = el.querySelector('.pack-header');
  if (header) header.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  if (expanded && animateReveal !== false) {
    requestAnimationFrame(() => animatePackReveal(packId));
  }
}

function animatePackReveal(packId) {
  const el = document.getElementById('pack-' + packId);
  if (!el || el.classList.contains('collapsed')) return;

  const items = [];
  ['.pack-desc', '.pack-portal-hook', '.stories-list .story-card', '.pack-soon-bar', '.pack-locked-bar']
    .forEach(sel => el.querySelectorAll('.pack-body ' + sel).forEach(node => items.push(node)));
  if (!items.length) return;

  items.forEach(node => {
    node.classList.remove('pack-reveal-item');
    node.style.removeProperty('--reveal-i');
  });
  el.classList.remove('pack-reveal');
  void el.offsetWidth;

  items.forEach((node, i) => {
    node.style.setProperty('--reveal-i', i);
    node.classList.add('pack-reveal-item');
  });
  el.classList.add('pack-reveal');

  const duration = 450 + Math.max(0, items.length - 1) * 70 + 50;
  clearTimeout(el._revealTimer);
  el._revealTimer = setTimeout(() => {
    el.classList.remove('pack-reveal');
    items.forEach(node => {
      node.classList.remove('pack-reveal-item');
      node.style.removeProperty('--reveal-i');
    });
  }, duration);
}

function expandPackSection(packId) {
  const set = getExpandedPacks();
  set.add(packId);
  setExpandedPacks(set);
  applyPackCollapse(packId, true);
}

function togglePackSection(packId) {
  const set = getExpandedPacks();
  const expanded = !set.has(packId);
  if (expanded) set.add(packId);
  else set.delete(packId);
  setExpandedPacks(set);
  applyPackCollapse(packId, expanded, expanded);
}

function packSectionAttrs(packId) {
  const expanded = isPackExpanded(packId);
  return {
    cls: expanded ? 'pack-section' : 'pack-section collapsed',
    aria: expanded ? 'true' : 'false',
    expanded
  };
}

async function loadGames() {
  try {
    const r = await fetch('games.json');
    if (r.ok) {
      const raw = await r.json();
      // Filtrer les entrées invalides silencieusement
      allGames = raw.filter(g => g && g.file && g.title && g.lang);
    } else {
      console.error('games.json HTTP error:', r.status);
      allGames = [];
    }
  } catch(e) {
    console.error('games.json fetch error:', e);
    allGames = [];
  }
  try {
    renderLibrary();
    scrollToPackHash();
  } catch(e) {
    console.error('renderLibrary error:', e);
    document.getElementById('content').innerHTML =
      `<div class="empty-state">Erreur : ${e.message}</div>`;
  }
}

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function getStoriesFinishedCount() {
  return window.SFShared ? SFShared.getStoriesFinishedCount() : 0;
}

function renderStarterBanner(kidsOnly) {
  if (getStoriesFinishedCount() > 0) return '';
  const txt = STARTER_TXT[currentLang] || STARTER_TXT.fr;
  const file = getStarterStoryFile(kidsOnly);
  const game = allGames.find(g => g.file === file && g.lang === currentLang);
  if (!game) return '';

  return `<div class="starter-banner" onclick="launchStory('${game.file}')">
    <div class="starter-label">${txt.label}</div>
    <div class="starter-row">
      <div class="starter-icon">${game.icon || '📖'}</div>
      <div style="flex:1">
        <div class="starter-title">${txt.title}</div>
        <div class="starter-sub">${game.title} — ${txt.sub}</div>
        <span class="starter-btn">${txt.btn} →</span>
      </div>
    </div>
  </div>`;
}

function renderLibrary() {
  if (getLibraryViewMode() === 'shelf') {
    renderShelfLibrary();
  } else {
    renderListLibrary();
  }
  updateViewToggleLabel();
  initOnboardTip();
}

function updateViewToggleLabel() {
  const btn = document.getElementById('view-toggle-btn');
  if (!btn) return;
  const labels = {
    shelf: { fr:'📚 Passer en vue liste', en:'📚 Switch to list view', es:'📚 Cambiar a vista de lista' },
    list:  { fr:'🗄️ Passer en vue rayons', en:'🗄️ Switch to shelf view', es:'🗄️ Cambiar a vista de estantería' }
  };
  const mode = getLibraryViewMode();
  btn.textContent = (labels[mode] && labels[mode][currentLang]) || labels[mode].fr;
}

function renderListLibrary() {
  if (window.SFShared) SFShared.ensureDefaultExpandedPacks();
  const unlocked = getUnlockedPacks();
  let opts = {};
  try { opts = JSON.parse(localStorage.getItem('sf_options') || '{}'); } catch(e) {}
  const kidsOnly = opts.kids === true || opts.kids === 'true';

  const filtered = allGames.filter(g => {
    if (g.lang !== currentLang) return false;
    if (kidsOnly && g.kids !== true && g.kids !== 'true') return false;
    return true;
  });

  // ── MARQUE-PAGES ── (toutes langues)
  const bookmarks = JSON.parse(localStorage.getItem('sf_bookmarks') || '[]')
    .filter(b => allGames.find(g => g.file === b.storyFile));

  let html = '';

  // Bannière mode enfant si actif
  if (kidsOnly) {
    const msg = { fr:'Mode enfant activé — seules les histoires pour enfants sont affichées',
                  en:'Kids mode on — only children\'s stories are shown',
                  es:'Modo infantil activado — solo se muestran historias para niños' }[currentLang] || '';
    html += `<div class="kids-banner" style="margin-bottom:20px">
      <div class="kids-banner-icon">🧒</div>
      <div class="kids-banner-text">
        <div class="kids-banner-title">MODE ENFANT</div>
        <div class="kids-banner-sub">${msg}</div>
      </div>
    </div>`;
  }

  html += renderStarterBanner(kidsOnly);
  if (window.SFStoryMeta) {
    html += SFStoryMeta.spotlightBanner(filtered, currentLang, 'launchStory', 'openCommunityFromLibrary');
  }

  if (bookmarks.length) {
    const bmTitle = { fr:'Reprendre', en:'Continue', es:'Continuar' }[currentLang] || 'Reprendre';
    const ui = packUi(currentLang);
    const bm = packSectionAttrs('bookmarks');
    html += `<div class="${bm.cls}" id="pack-bookmarks" style="--pack-color:rgba(100,220,150,0.6);margin-bottom:20px">
      <div class="pack-header" role="button" tabindex="0" aria-expanded="${bm.aria}"
        onclick="togglePackSection('bookmarks')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePackSection('bookmarks')}">
        <div class="pack-icon">🔖</div>
        <div class="pack-info">
          <div class="pack-name">${bmTitle}</div>
          <div class="pack-meta">${ui.bookmark(bookmarks.length)}</div>
        </div>
        <span class="pack-toggle" aria-hidden="true">›</span>
      </div>
      <div class="pack-body">
      <div class="stories-list">`;

    bookmarks.forEach(bm => {
      const game = allGames.find(g => g.file === bm.storyFile);
      const statsStr = Object.entries(bm.stats || {})
        .map(([k,v]) => `${k} ${v}`).join(' • ');
      const date = new Date(bm.savedAt).toLocaleDateString();
      html += `<div class="story-card" onclick="resumeStory('${bm.storyFile}')" style="--pack-color:rgba(100,220,150,0.6)">
        <div class="story-icon">${game?.icon || '📖'}</div>
        <div class="story-info">
          <div class="story-title">${bm.storyName}</div>
          <div class="story-desc">📍 ${bm.sceneTitle}</div>
          <div class="story-meta">
            <span class="story-tag" style="border-color:rgba(100,220,150,0.3);color:#64dc96">${date}</span>
            ${statsStr ? `<span class="story-tag">${statsStr}</span>` : ''}
          </div>
        </div>
        <div class="story-arrow" style="color:#64dc96">›</div>
      </div>`;
    });

    html += `</div></div></div>`;
  }

  // Grouper par pack
  const byPack = {};
  filtered.forEach(g => {
    const packId = g.pack || (g.kids ? 'kids' : 'free');
    if (!byPack[packId]) byPack[packId] = [];
    byPack[packId].push(g);
  });

  const packIds = Object.keys(byPack);
  Object.keys(PACK_CONFIG).forEach(id => {
    if (PACK_CONFIG[id].comingSoon && !packIds.includes(id)) packIds.push(id);
  });
  packIds.sort((a,b) => {
    const oa = PACK_CONFIG[a]?.order ?? 99;
    const ob = PACK_CONFIG[b]?.order ?? 99;
    return oa - ob;
  });

  if (!packIds.length && !bookmarks.length) {
    document.getElementById('content').innerHTML =
      `<div class="empty-state">Aucune histoire disponible en ${currentLang.toUpperCase()}</div>`;
    return;
  }

  packIds.forEach(packId => {
    const stories = byPack[packId] || [];
    const cfg = PACK_CONFIG[packId] || { name:{fr:packId,en:packId,es:packId}, icon:'📖', color:'rgba(200,169,110,0.5)', order:99 };
    const isUnlocked = cfg.free || unlocked.includes(packId);
    const packName = cfg.name[currentLang] || cfg.name.fr;
    const count = stories.length;
    const colorVar = cfg.color;

    const ui = packUi(currentLang);
    const soonLabel = ui.soon;

    // Badge prix/gratuit
    let priceBadge = '';
    if (cfg.comingSoon) {
      priceBadge = `<span class="pack-price soon" style="--pack-color:${colorVar}">⏳ ${soonLabel}</span>`;
    } else if (cfg.free) {
      priceBadge = `<span class="pack-price free">${ui.free}</span>`;
    } else if (isUnlocked) {
      priceBadge = `<span class="pack-price" style="--pack-color:${colorVar};border-color:rgba(100,220,150,0.5);color:#64dc96;background:rgba(100,220,150,0.08)">${ui.unlocked}</span>`;
    } else {
      const livePrice = window.SFBilling ? SFBilling.getPrice(packId) : null;
      priceBadge = `<span class="pack-price locked" style="--pack-color:${colorVar}" onclick="event.stopPropagation(); buyPack('${packId}')">🔒 ${livePrice || cfg.price || ''}</span>`;
    }

    const packState = packSectionAttrs(packId);
    const countLabel = cfg.comingSoon
      ? ({ fr:'Histoires <strong>en préparation</strong>', en:'Stories <strong>in the works</strong>', es:'Historias <strong>en preparación</strong>' }[currentLang] || 'Histoires <strong>en préparation</strong>')
      : currentLang === 'fr'
        ? `<strong>${count}</strong> histoire${count > 1 ? 's' : ''}`
        : currentLang === 'en'
          ? `<strong>${count}</strong> stor${count > 1 ? 'ies' : 'y'}`
          : `<strong>${count}</strong> historia${count > 1 ? 's' : ''}`;

    const collapsedHint = (!packState.expanded && count > 0 && !cfg.comingSoon)
      ? `<span class="pack-collapsed-hint"> · ${ui.tapToExpand(count)}</span>`
      : '';

    const metaLine = cfg.comingSoon
      ? countLabel
      : `${countLabel}${collapsedHint}`;

    html += `<div class="${packState.cls}" id="pack-${packId}" style="--pack-color:${colorVar}">
      <div class="pack-header" role="button" tabindex="0" aria-expanded="${packState.aria}"
        onclick="togglePackSection('${packId}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePackSection('${packId}')}">

          <div class="pack-name">${packName}</div>
          <div class="pack-meta">${metaLine}</div>
        </div>
        ${priceBadge}
        <span class="pack-toggle" aria-hidden="true">›</span>
      </div>
      <div class="pack-body">`;
    html += cfg.desc ? `<div class="pack-desc" style="font-size:12px;color:var(--text3);padding:0 16px 12px;font-style:italic;opacity:0.7;border:1px solid var(--border);border-top:none;background:var(--bg3)">${cfg.desc[currentLang] || cfg.desc.fr}</div>` : '';

    const hasPortals = stories.some(g => g.portal === true);
    if (!cfg.comingSoon && !isUnlocked && hasPortals) {
      html += `<div class="pack-portal-hook">🔗 ${PORTAL_PACK_HOOK[currentLang] || PORTAL_PACK_HOOK.fr}</div>`;
    }

    // Stories
    html += `<div class="stories-list">`;
    if (cfg.comingSoon && !count) {
      const soonMsg = {
        fr:'Ce pack arrive bientôt sur Fableris. Les histoires sont en cours d\'écriture — l\'achat n\'est pas encore ouvert.',
        en:'This pack is coming soon to Fableris. Stories are being written — purchases are not open yet.',
        es:'Este pack llegará pronto a Fableris. Las historias están en preparación — la compra aún no está abierta.'
      };
      html += `<div class="pack-soon-bar"><strong>⏳ ${soonLabel}</strong><br>${soonMsg[currentLang] || soonMsg.fr}</div>`;
    }
    stories.forEach(g => {
      const locked  = !isUnlocked;
      const isPortal = g.portal === true;
      const clickable = !locked && !isPortal;

      html += `<div class="story-card${locked ? ' locked' : ''}${isPortal ? ' portal' : ''}"
        onclick="${clickable ? `launchStory('${g.file}')` : ''}"
        style="--pack-color:${colorVar};${isPortal ? 'opacity:0.75;cursor:default' : ''}">
        <div class="story-icon">${g.kids ? '🧒' : (g.icon || '📖')}</div>
        <div class="story-info">
          <div class="story-title">${g.title}</div>
          ${window.SFStoryMeta ? SFStoryMeta.authorLine(g, currentLang) : (g.author ? `<div class="story-author">Par ${g.author}</div>` : '')}
          <div class="story-desc">${g.desc || ''}</div>
          <div class="story-meta">
            ${window.SFStoryMeta ? SFStoryMeta.metaTags(g, currentLang, { portal: isPortal }) : ''}
            ${!window.SFStoryMeta ? `
            ${g.kids    ? `<span class="story-tag kids">Enfants</span>`   : ''}
            ${g.new     ? `<span class="story-tag new">Nouveau</span>`    : ''}
            ${isPortal  ? `<span class="story-tag portal">🔗 Via portail</span>` : ''}
            ${g.duration ? `<span class="story-tag">${g.duration}</span>` : ''}
            ${g.endings  ? `<span class="story-tag">${g.endings} fins</span>` : ''}` : ''}
          </div>
        </div>
        ${locked
          ? `<div class="story-lock">🔒</div>`
          : isPortal
            ? `<div class="story-lock" title="Accessible depuis l'histoire principale">🔗</div>`
            : `<div class="story-arrow">›</div>`}
      </div>`;
    });
    html += `</div>`;

    // Barre verrouillée (pas pour les packs « bientôt »)
    if (!cfg.comingSoon && !isUnlocked && count > 0) {
      const lockMsg = {
        fr:`Achetez le ${packName} pour débloquer ces histoires`,
        en:`Purchase the ${packName} to unlock these stories`,
        es:`Compra el ${packName} para desbloquear estas historias`
      };
      html += `<div class="pack-locked-bar">
        <span class="lock-icon">🔒</span>
        <span>${lockMsg[currentLang] || lockMsg.fr}</span>
      </div>`;

    html += `</div></div>`;

  document.getElementById('content').innerHTML = html;

}

function getLibraryViewMode() {

}
function setLibraryViewMode(mode) {
  try { localStorage.setItem('sf_library_view', mode); } catch(e) {}
}
function toggleLibraryView() {

  setLibraryViewMode(next);

  renderLibrary();

function getOnboardTipDismissed() {
  return localStorage.getItem('sf_library_tip_dismissed') === '1';
}
function dismissOnboardTip() {
  const tip = document.getElementById('onboard-tip');
  if (tip) tip.style.display = 'none';
  try { sessionStorage.setItem('sf_library_tip_hidden', '1'); } catch (e) {}
  const checkbox = document.getElementById('tip-hide-checkbox');
  if (checkbox && checkbox.checked) {
    try { localStorage.setItem('sf_library_tip_dismissed', '1'); } catch(e) {}
  }
}
function initOnboardTip() {
  const tip = document.getElementById('onboard-tip');
  if (!tip) return;
  if (getOnboardTipDismissed()) { tip.style.display = 'none'; return; }
  try { if (sessionStorage.getItem('sf_library_tip_hidden') === '1') { tip.style.display = 'none'; return; } } catch (e) {}
  const txt = { fr:'👆 Ce bouton bascule entre la vue étagère et la vue liste classique — choisis celle que tu préfères !',
                en:'👆 This button switches between the shelf view and the classic list view — pick whichever you prefer!',
                es:'👆 Este botón alterna entre la vista de estantería y la vista de lista clásica — ¡elige la que prefieras!' };

  const t = document.getElementById('onboard-tip-text');
  const l = document.getElementById('onboard-tip-checklabel');

  if (l) l.textContent = lbl[currentLang] || lbl.fr;

const SHELF_TONES = {
  bookmarks:'tone-bookmarks', free:'tone-free', kids:'tone-kids', cinq_lames:'tone-lames',
  cosmos:'tone-cosmos', neon:'tone-neon', pirates:'tone-pirates', fantasy:'tone-fantasy', wilds:'tone-wilds'
};

function renderShelfLibrary() {
  if (window.SFShared) SFShared.ensureDefaultExpandedPacks();
  const unlocked = getUnlockedPacks();
  let opts = {};
  try { opts = JSON.parse(localStorage.getItem('sf_options') || '{}'); } catch(e) {}
  const kidsOnly = opts.kids === true || opts.kids === 'true';

  const filtered = allGames.filter(g => {
    if (g.lang !== currentLang) return false;
    if (kidsOnly && g.kids !== true && g.kids !== 'true') return false;
    return true;
  });

  const bookmarks = JSON.parse(localStorage.getItem('sf_bookmarks') || '[]')
    .filter(b => allGames.find(g => g.file === b.storyFile));

  let html = '';

  if (kidsOnly) {
    const msg = { fr:'Mode enfant activé — seules les histoires pour enfants sont affichées',
                  en:'Kids mode on — only children\'s stories are shown',
                  es:'Modo infantil activado — solo se muestran historias para niños' }[currentLang] || '';
    html += `<div class="kids-banner" style="margin-bottom:20px">
      <div class="kids-banner-icon">🧒</div>
      <div class="kids-banner-text">
        <div class="kids-banner-title">MODE ENFANT</div>
        <div class="kids-banner-sub">${msg}</div>
      </div>
    </div>`;
  }

  html += renderStarterBanner(kidsOnly);
  if (window.SFStoryMeta) {
    html += SFStoryMeta.spotlightBanner(filtered, currentLang, 'launchStory', 'openCommunityFromLibrary');
  }

  const escAttr = (s) => String(s == null ? '' : s).replace(/"/g, '&quot;');
  const escHtml = (s) => window.SFShared ? SFShared.esc(s) : String(s == null ? '' : s);
  const isCommunityStory = (g) => window.SFStoryMeta ? SFStoryMeta.isCommunity(g) : (g.community === true || g.community === 'true');

  if (bookmarks.length) {
    const bmTitle = { fr:'Reprendre', en:'Continue', es:'Continuar' }[currentLang] || 'Reprendre';
    html += `<div class="shelf-block" id="shelf-bookmarks">
      <div class="shelf-block-header"><div class="shelf-block-header-main"><div class="shelf-block-icon">🔖</div><div class="shelf-block-name">${bmTitle}</div></div></div>
      <div class="bookcase-row">`;
    bookmarks.forEach(bm => {
      const game = allGames.find(g => g.file === bm.storyFile);
      const date = new Date(bm.savedAt).toLocaleDateString();
      html += `<div class="book tone-bookmarks" onclick="openBookPopover(this)"
        data-icon="${escAttr(game?.icon || '📖')}" data-title="${escAttr(bm.storyName)}" data-author=""
        data-desc="📍 ${escAttr(bm.sceneTitle)} — ${escAttr(date)}" data-locked="0" data-action="resume" data-file="${escAttr(bm.storyFile)}">
        <div class="book-icon">${game?.icon || '📖'}</div><div class="book-title">${escHtml(bm.storyName)}</div></div>`;
    });
    html += `</div><div class="shelf-plank"></div></div>`;
  }

  const byPack = {};
  filtered.forEach(g => {
    const packId = g.pack || (g.kids ? 'kids' : 'free');
    if (!byPack[packId]) byPack[packId] = [];
    byPack[packId].push(g);
  });

  const packIds = Object.keys(byPack);
  Object.keys(PACK_CONFIG).forEach(id => {
    if (PACK_CONFIG[id].comingSoon && !packIds.includes(id)) packIds.push(id);
  });
  packIds.sort((a,b) => (PACK_CONFIG[a]?.order ?? 99) - (PACK_CONFIG[b]?.order ?? 99));

  if (!packIds.length && !bookmarks.length) {
    document.getElementById('content').innerHTML =
      `<div class="empty-state">Aucune histoire disponible en ${currentLang.toUpperCase()}</div>`;
    return;
  }

  packIds.forEach(packId => {
    const stories = byPack[packId] || [];
    const cfg = PACK_CONFIG[packId] || { name:{fr:packId,en:packId,es:packId}, icon:'📖', order:99 };
    const isUnlocked = cfg.free || unlocked.includes(packId);
    const packName = cfg.name[currentLang] || cfg.name.fr;
    const count = stories.length;
    const tone = SHELF_TONES[packId] || 'tone-free';
    const ui = packUi(currentLang);

    let priceBadge = '';
    if (cfg.comingSoon) {
      priceBadge = `<span class="shelf-block-price soon">⏳ ${ui.soon}</span>`;
    } else if (cfg.free) {
      priceBadge = `<span class="shelf-block-price free">${ui.free}</span>`;
    } else if (isUnlocked) {
      priceBadge = `<span class="shelf-block-price" style="color:#64dc96;border-color:rgba(100,220,150,0.5)">${ui.unlocked}</span>`;
    } else {
      const livePrice = window.SFBilling ? SFBilling.getPrice(packId) : null;
      priceBadge = `<span class="shelf-block-price" onclick="event.stopPropagation(); buyPack('${packId}')">🔒 ${livePrice || cfg.price || ''}</span>`;
    }

    html += `<div class="shelf-block" id="shelf-${packId}">
      <div class="shelf-block-header">
        <div class="shelf-block-header-main"><div class="shelf-block-icon">${cfg.icon}</div><div class="shelf-block-name">${packName}</div></div>
        ${priceBadge}
      </div>
      <div class="bookcase-row">`;

    if (cfg.comingSoon && !count) {
      html += `</div><div class="shelf-soon-msg">⏳ ${ui.soon}</div>`;
    } else {
      stories.forEach(g => {
        const locked = !isUnlocked;
        const isPortal = g.portal === true;
        const isCommunity = isCommunityStory(g);
        const action = locked ? 'buy' : (isPortal ? 'none' : 'launch');
        html += `<div class="book ${tone}${locked ? ' locked' : ''}" onclick="openBookPopover(this)"
          data-icon="${escAttr(g.kids ? '🧒' : (g.icon || '📖'))}" data-title="${escAttr(g.title)}"
          data-author="${escAttr(g.author || '')}" data-desc="${escAttr(g.desc || '')}"
          data-locked="${locked ? '1' : '0'}" data-action="${action}" data-file="${escAttr(g.file)}" data-pack="${escAttr(packId)}">
          ${isCommunity ? '<div class="book-community-dot"></div>' : ''}
          <div class="book-icon">${g.kids ? '🧒' : (g.icon || '📖')}</div>
          <div class="book-title">${escHtml(g.title)}</div>
          ${locked ? '<div class="book-lock">🔒</div>' : ''}
        </div>`;
      });
      html += `</div>`;
    }
    html += `<div class="shelf-plank"></div></div>`;
  });

  document.getElementById('content').innerHTML = html;
  injectRestoreButton();
}

let shelfSelectedBook = null;

const POPOVER_UI = {
  fr: { by: 'Par', play: '▶ Jouer', resume: '▶ Reprendre', unlock: '🔒 Débloquer le pack', portal: '🔗 Accessible via portail' },
  en: { by: 'By', play: '▶ Play', resume: '▶ Resume', unlock: '🔒 Unlock pack', portal: '🔗 Access via portal' },
  es: { by: 'Por', play: '▶ Jugar', resume: '▶ Continuar', unlock: '🔒 Desbloquear pack', portal: '🔗 Accesible por portal' }
};

function openBookPopover(el) {
  if (shelfSelectedBook && shelfSelectedBook !== el) shelfSelectedBook.classList.remove('selected');

  el.classList.add('selected');
  shelfSelectedBook = el;

  requestAnimationFrame(() => {
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });

  const action = el.dataset.action;
  const ui = POPOVER_UI[currentLang] || POPOVER_UI.fr;
  document.getElementById('bp-icon').textContent = el.dataset.icon || '📖';
  document.getElementById('bp-title').textContent = el.dataset.title || '';
  document.getElementById('bp-author').textContent = el.dataset.author ? `${ui.by} ${el.dataset.author}` : '';
  document.getElementById('bp-desc').textContent = el.dataset.desc || '';

  const playBtn = document.getElementById('bp-play');
  if (action === 'buy') {
    playBtn.textContent = ui.unlock;
    playBtn.onclick = () => { closeBookPopover(); buyPack(el.dataset.pack); };
  } else if (action === 'resume') {
    playBtn.textContent = ui.resume;
    playBtn.onclick = () => { closeBookPopover(); resumeStory(el.dataset.file); };
  } else if (action === 'none') {
    playBtn.textContent = ui.portal;
    playBtn.onclick = () => closeBookPopover();
  } else {
    playBtn.textContent = ui.play;
    playBtn.onclick = () => { closeBookPopover(); launchStory(el.dataset.file); };
  }

  document.getElementById('book-popover').classList.add('open');
  document.getElementById('book-backdrop').classList.add('open');
}
function closeBookPopover() {
  if (shelfSelectedBook) shelfSelectedBook.classList.remove('selected');
  shelfSelectedBook = null;
  const pop = document.getElementById('book-popover');
  const bd = document.getElementById('book-backdrop');
  if (pop) pop.classList.remove('open');
  if (bd) bd.classList.remove('open');
}

function sfToast(msg) {
  let el = document.getElementById('sf-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sf-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
      'background:#1a1710;border:1px solid #3a3222;color:#e8e0d0;padding:12px 18px;' +
      'border-radius:10px;font-size:13px;max-width:80%;text-align:center;z-index:900;' +
      'opacity:0;transition:opacity .25s;pointer-events:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2600);
}

let _buying = false;
async function buyPack(packId) {
  if (_buying) return;                       // évite le double-tap
  const cfg = PACK_CONFIG[packId];
  if (!cfg) return;
  if (cfg.comingSoon) { sfToast(bt('comingSoon')); return; }

  if (!window.SFBilling || !SFBilling.isAvailable()) {
    sfToast(bt('unavailable'));
    return;
  }
  if (SFBilling.isUnlocked(packId)) { sfToast(bt('owned')); return; }

  _buying = true;
  try {
    // Le plugin n'est prêt qu'après deviceready : on l'attend avant
    // de conclure quoi que ce soit sur la disponibilité des achats.
    if (!SFBilling.isReady()) sfToast(bt('connecting'));
    const available = await SFBilling.ensureReady();
    if (!available) { sfToast(bt('unavailable')); return; }

    sfToast(bt('pending'));
    const res = await SFBilling.buy(packId);
    if (res.ok) {
      sfToast(bt('success'));
      renderLibrary();
    } else if (res.reason === 'cancelled') {
      // fermeture volontaire de la fenêtre Google Play : rien à signaler
    } else if (res.reason === 'pending') {
      // paiement accepté mais pas encore confirmé (paiement différé)
      sfToast(bt('processing'));
    } else if (res.reason === 'not_found') {
      console.error('[billing] not_found', packId, SFBilling.getProductDebug?.(packId));
      sfToast(bt('notfound'));
      setTimeout(() => showBillingDiagnostic(), 400);
    } else if (res.reason === 'coming_soon') {
      sfToast(bt('comingSoon'));
    } else if (res.reason === 'web' || res.reason === 'plugin_missing') {
      sfToast(bt('unavailable'));
    } else {
      sfToast(bt('failed'));
      console.error('[billing] achat échoué:', res.reason, SFBilling.getLastError());
    }
  } finally {
    _buying = false;
  }
}

// Google Play impose un moyen de restaurer ses achats (changement
// de téléphone, réinstallation) — sinon l'utilisateur perd ses packs.
async function restorePurchases() {
  if (!window.SFBilling || !SFBilling.isAvailable()) {
    sfToast(bt('unavailable'));
    return;
  }
  const before = SFBilling.getUnlockedPacks().length;
  sfToast(bt('restoring'));
  const res = await SFBilling.restore();
  if (!res.ok) {
    sfToast(res.reason === 'web' || res.reason === 'plugin_missing'
      ? bt('unavailable') : bt('failed'));
    return;
  }
  renderLibrary();
  sfToast(res.packs.length > before ? bt('restored') : bt('nothing'));
}

  if (d.lastError) lines.push(t.err + ' : ' + d.lastError);
  (d.products || []).forEach(p => {
    if (p.note === 'not_registered_on_play') lines.push(t.notReg + ' — ' + p.productId);
    else if (!p.loaded) lines.push(t.missing + '\n   ' + p.productId);
    else if (!p.hasOffer) lines.push(t.noOffer + '\n   ' + p.productId);
    else lines.push(t.ok + ' — ' + p.productId);
  });
  lines.push('', t.hint);
  return lines.join('\n');
}

async function showBillingDiagnostic() {
  const overlay = document.getElementById('billing-diag-overlay');
  const lines = document.getElementById('billing-diag-lines');
  if (!overlay || !lines) return;
  overlay.classList.add('open');
  lines.textContent = 'Chargement…';
  if (!window.SFBilling || !SFBilling.getFullDiagnostic) {
    lines.textContent = 'billing.js indisponible';
    return;
  }
  try {
    const d = await SFBilling.getFullDiagnostic();
    lines.textContent = explainBillingDiag(d);
    console.info('[billing] diagnostic', d);
  } catch (e) {
    lines.textContent = 'Erreur diagnostic : ' + (e.message || e);
  }
}

function closeBillingDiagnostic() {
  document.getElementById('billing-diag-overlay')?.classList.remove('open');
}

function injectRestoreButton() {
  if (document.getElementById('btn-restore')) return;
  const content = document.getElementById('content');
  if (!content) return;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'text-align:center;padding:24px 16px 8px';
  wrap.innerHTML = `<button id="btn-restore"
      style="background:none;border:1px solid #2a2418;color:#9a8a70;font-size:11px;
             letter-spacing:1.5px;padding:10px 18px;border-radius:8px;cursor:pointer;
             font-family:Lato,sans-serif">${bt('restore')}</button>
      <div style="font-size:10px;color:#5a5040;margin-top:8px;opacity:0.7">Maintenir 1 s → diagnostic achats</div>`;
  content.appendChild(wrap);
  const btn = document.getElementById('btn-restore');
  btn.onclick = restorePurchases;
  let holdTimer = null;
  const startHold = () => { holdTimer = setTimeout(() => { holdTimer = null; showBillingDiagnostic(); }, 900); };
  const cancelHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
  btn.addEventListener('mousedown', startHold);
  btn.addEventListener('mouseup', cancelHold);
  btn.addEventListener('mouseleave', cancelHold);
  btn.addEventListener('touchstart', startHold, { passive: true });
  btn.addEventListener('touchend', cancelHold);
  btn.addEventListener('touchcancel', cancelHold);
}

      <input id="popup-name" type="text" maxlength="20" placeholder="..."
        style="width:100%;background:#1a1710;border:1px solid #2a2418;border-radius:8px;color:#e8e0d0;font-size:18px;padding:11px;text-align:center;outline:none;margin-bottom:14px;font-family:'Cormorant Garamond',serif"
        onkeydown="if(event.key==='Enter')document.getElementById('popup-confirm').click()">
      <button id="popup-confirm"
        style="width:100%;padding:12px;border:1px solid #8a6a30;background:rgba(200,169,110,0.1);color:#e8d4a0;font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;border-radius:8px;cursor:pointer;margin-bottom:8px"
        onclick="

          document.body.removeChild(this.closest('[style*=fixed]'));
          window.location.href='game.html?story='+encodeURIComponent('${file}');
        ">${t.btn}</button>
      <button style="background:none;border:none;color:#5a5040;font-size:11px;cursor:pointer;font-family:Lato,sans-serif;letter-spacing:1px"
        onclick="
          document.body.removeChild(this.closest('[style*=fixed]'));
          window.location.href='game.html?story='+encodeURIComponent('${file}');
        ">${t.skip}</button>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('popup-name')?.focus(), 200);
}
