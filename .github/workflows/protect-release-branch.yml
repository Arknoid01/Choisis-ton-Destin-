# Bloque le merge 1.7 / 1.8 / 1.9 → main sans label explicite.
name: Protect release branches

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block unauthorized release → main merge
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          if [ "$BASE_REF" != "main" ]; then
            echo "Not targeting main — OK."
            exit 0
          fi
          case "$HEAD_REF" in
            1.7)
              echo "$LABELS_JSON" | grep -q 'release-1.7-authorized' && {
                echo "Label release-1.7-authorized present — OK."
                exit 0
              }
              echo "::error::Merge 1.7 → main bloqué. Ajoutez le label release-1.7-authorized."
              exit 1
              ;;
            1.8)
              echo "$LABELS_JSON" | grep -q 'release-1.8-authorized' && {
                echo "Label release-1.8-authorized present — OK."
                exit 0
              }
              echo "::error::Merge 1.8 → main bloqué. Ajoutez le label release-1.8-authorized."
              exit 1
              ;;
            1.9)
              echo "$LABELS_JSON" | grep -q 'release-1.9-authorized' && {
                echo "Label release-1.9-authorized present — OK."
                exit 0
              }
              echo "::error::Merge 1.9 → main bloqué. Ajoutez le label release-1.9-authorized."
              exit 1
              ;;
            *)
              echo "Not a protected release → main PR — OK."
              exit 0
              ;;
          esac
