# Bloque le merge des branches release → main sans label explicite.
name: Protect release branches

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block unauthorized release → main merge
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          if [ "$BASE_REF" != "main" ]; then
            echo "Not targeting main — OK."
            exit 0
          fi
          check_label() {
            local branch="$1"
            local label="$2"
            if [ "$HEAD_REF" != "$branch" ]; then return 0; fi
            echo "$LABELS_JSON" | grep -q "$label" && {
              echo "Label $label present — OK."
              exit 0
            }
            echo "::error::Merge $branch → main bloqué. Ajoutez le label $label."
            exit 1
          }
          check_label "1.7" "release-1.7-authorized"
          check_label "1.8" "release-1.8-authorized"
          check_label "1.9" "release-1.9-authorized"
          check_label "2.0" "release-2.0-authorized"
          check_label "2.1" "release-2.1-authorized"
          check_label "2.2" "release-2.2-authorized"
          echo "Not a protected release → main PR — OK."
