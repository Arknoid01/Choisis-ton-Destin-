<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Actualités — Fableris</title>
<script src="capacitor.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,300&family=Cinzel:wght@400;600&family=DM+Mono:wght@300;400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;background:#0a0a0e;color:#e0d8f0;font-family:'Cormorant Garamond',serif;overflow-x:hidden;padding-top:var(--safe-top) !important;}

:root{
  --safe-top: var(--android-safe-area-inset-top, env(safe-area-inset-top, 36px));
  --gold:#c8a96e;--gold2:#e8d4a0;--gold3:#8a6a30;
  --purple:#7c6dfa;--blue:#8ec4ff;
  --bg:#0a0a0e;--bg2:#111118;--bg3:#18181f;
  --border:#26262e;--text:#e0d8f0;--dim:#7070a0;--dimmer:#404050;
}

#topbar{
  position:fixed;top:0;left:0;right:0;
  height:calc(52px + var(--safe-top)) !important;
  padding-top:var(--safe-top) !important;
  z-index:100;
  background:rgba(10,10,14,0.92);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:12px;padding-left:16px;padding-right:16px;
}
.back-btn{
  width:36px;height:36px;border-radius:8px;
  border:1px solid var(--border);background:none;
  color:var(--dim);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;transition:all .15s;flex-shrink:0;
}
.back-btn:hover{border-color:var(--gold3);color:var(--text);}
.topbar-title{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--text);letter-spacing:2px;}
.topbar-version{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:var(--dimmer);}

#scroll{
  padding-top:calc(52px + var(--safe-top));
  overflow-y:auto;min-height:100vh;-webkit-overflow-scrolling:touch;
}
#content{max-width:600px;margin:0 auto;padding:20px 16px 80px;}

.page-intro{
  font-size:15px;color:var(--dim);line-height:1.55;font-style:italic;
  margin-bottom:18px;
}

.news-tabs{
  display:flex;gap:8px;margin-bottom:18px;
}
.news-tab{
  flex:1;padding:11px 10px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg2);
  color:var(--dim);font-family:'Cinzel',serif;font-size:10px;
  font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .18s;
}
.news-tab.active.community{
  border-color:rgba(124,109,250,0.45);
  background:rgba(124,109,250,0.1);color:#d4cbff;
}
.news-tab.active.dlc{
  border-color:rgba(100,180,255,0.45);
  background:rgba(100,180,255,0.08);color:var(--blue);
}

.news-panel{display:none;}
.news-panel.active{display:block;}

.news-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;padding:16px;margin-bottom:12px;
  transition:border-color .2s, background .2s;
  animation:fade-up .4s ease both;
  cursor:pointer;
}
.news-card:hover{border-color:var(--dimmer);}
.news-card.community:hover{border-color:rgba(124,109,250,0.4);background:rgba(124,109,250,0.04);}
.news-card.dlc:hover{border-color:rgba(100,180,255,0.4);background:rgba(100,180,255,0.04);}
.news-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.news-icon{
  width:36px;height:36px;border-radius:9px;
  background:var(--bg3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.news-meta{flex:1;min-width:0;}
.news-title{
  font-family:'Cinzel',serif;font-size:14px;font-weight:600;
  color:var(--text);margin-bottom:4px;letter-spacing:0.5px;
  line-height:1.3;
}
.news-date-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.news-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--dimmer);}
.news-tag{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid;
}
.news-tag.community{color:#b8a8ff;border-color:rgba(124,109,250,0.4);}
.news-tag.dlc{color:var(--blue);border-color:rgba(100,180,255,0.4);}
.news-text{font-size:14px;color:var(--dim);line-height:1.7;}
.news-action{
  margin-top:12px;font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:0.5px;color:var(--gold2);
}

.community-cta{
  margin-top:8px;padding:14px 16px;border-radius:12px;
  border:1px dashed rgba(124,109,250,0.35);
  background:rgba(124,109,250,0.05);text-align:center;
}
.community-cta p{font-size:13px;color:var(--dim);line-height:1.55;margin-bottom:10px;}
.community-cta-btn{
  display:inline-block;padding:10px 16px;border-radius:8px;
  border:1px solid rgba(124,109,250,0.45);background:rgba(124,109,250,0.12);
  color:#d4cbff;font-family:'Cinzel',serif;font-size:10px;
  letter-spacing:2px;text-decoration:none;cursor:pointer;
}

.skeleton{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.skel-line{height:12px;border-radius:6px;background:var(--bg3);margin-bottom:8px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}
@keyframes fade-up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.empty-state{
  text-align:center;padding:40px 20px;
  color:var(--dimmer);font-family:'DM Mono',monospace;font-size:12px;
}
.footer-note{
  text-align:center;margin-top:24px;
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--dimmer);letter-spacing:1px;
}
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      var StatusBar = window.Capacitor.Plugins.StatusBar;
      var NavigationBar = window.Capacitor.Plugins.NavigationBar;
      if (StatusBar) StatusBar.hide().catch(function(){});
      if (NavigationBar) NavigationBar.hide().catch(function(){});
    }
  });
</script>
</head>
<body>

<div id="topbar">
  <a href="index.html" class="back-btn">←</a>
  <div class="topbar-title" id="txt-title">Actualités</div>
  <div class="topbar-version" id="app-version"></div>
</div>

<div id="scroll">
<div id="content">

  <p class="page-intro" id="txt-intro">Quoi de neuf sur Fableris ?</p>

  <div class="news-tabs">
    <button type="button" class="news-tab community active" id="tab-community" data-tab="community"></button>
    <button type="button" class="news-tab dlc" id="tab-dlc" data-tab="dlc"></button>
  </div>

  <div id="panel-community" class="news-panel active">
    <div id="list-community">
      <div class="skeleton"><div class="skel-line" style="width:60%"></div><div class="skel-line" style="width:100%"></div></div>
    </div>
    <div class="community-cta" id="community-cta" style="display:none">
      <p id="txt-cta-body"></p>
      <a class="community-cta-btn" id="txt-cta-btn" href="index.html?community=1"></a>
    </div>
  </div>

  <div id="panel-dlc" class="news-panel">
    <div id="list-dlc">
      <div class="skeleton"><div class="skel-line" style="width:55%"></div><div class="skel-line" style="width:90%"></div></div>
    </div>
  </div>

  <div class="footer-note" id="footer-note"></div>

</div>
</div>

<script>
const lang = localStorage.getItem('sf_lang') || 'fr';
let activeTab = (new URLSearchParams(location.search).get('tab') === 'dlc') ? 'dlc' : 'community';

const T = {
  fr: {
    title: 'Actualités',
    intro: 'Quoi de neuf sur Fableris ?',
    tabCommunity: 'Communauté',
    tabDlc: 'DLC',
    error: 'Impossible de charger les actualités.',
    updated: 'Mis à jour le',
    emptyCommunity: 'Aucune publication communautaire pour le moment.',
    emptyDlc: 'Aucun DLC annoncé pour le moment.',
    by: 'Par',
    play: 'Jouer →',
    viewPack: 'Voir le pack →',
    ctaBody: 'Participez au concours — votre histoire pourrait apparaître ici.',
    ctaBtn: 'Rejoindre la communauté'
  },
  en: {
    title: 'News',
    intro: "What's new on Fableris?",
    tabCommunity: 'Community',
    tabDlc: 'DLC',
    error: 'Unable to load news.',
    updated: 'Updated on',
    emptyCommunity: 'No community release yet.',
    emptyDlc: 'No DLC announced yet.',
    by: 'By',
    play: 'Play →',
    viewPack: 'View pack →',
    ctaBody: 'Join the contest — your story could appear here.',
    ctaBtn: 'Join the community'
  },
  es: {
    title: 'Noticias',
    intro: '¿Qué hay de nuevo en Fableris?',
    tabCommunity: 'Comunidad',
    tabDlc: 'DLC',
    error: 'No se pueden cargar las noticias.',
    updated: 'Actualizado el',
    emptyCommunity: 'Sin publicación de la comunidad por ahora.',
    emptyDlc: 'Sin DLC anunciado por ahora.',
    by: 'Por',
    play: 'Jugar →',
    viewPack: 'Ver pack →',
    ctaBody: 'Participa en el concurso — tu historia podría aparecer aquí.',
    ctaBtn: 'Unirse a la comunidad'
  }
};

function t(key) { return (T[lang] || T.fr)[key] || key; }

function applyLang() {
  document.getElementById('txt-title').textContent = t('title');
  document.getElementById('txt-intro').textContent = t('intro');
  document.getElementById('tab-community').textContent = t('tabCommunity');
  document.getElementById('tab-dlc').textContent = t('tabDlc');
  document.getElementById('txt-cta-body').textContent = t('ctaBody');
  document.getElementById('txt-cta-btn').textContent = t('ctaBtn');
  document.title = t('title') + ' — Fableris';
  document.documentElement.lang = lang;
}

function formatDate(dateStr) {
  try {
    return new Date(dateStr).toLocaleDateString(
      lang === 'en' ? 'en-GB' : lang === 'es' ? 'es-ES' : 'fr-FR',
      { day: 'numeric', month: 'long', year: 'numeric' }
    );
  } catch { return dateStr; }
}

function sortByDate(items) {
  return (items || []).slice().sort((a, b) => {
    return (Date.parse(b.date || '') || 0) - (Date.parse(a.date || '') || 0);
  });
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let _newsData = { community: [], dlc: [] };

function openItem(item) {
  if (item.file) {
    localStorage.setItem('sf_game_file', item.file);
    window.location.href = 'game.html?story=' + encodeURIComponent(item.file);
    return;
  }
  if (item.pack) {
    window.location.href = 'stories.html#pack-' + item.pack;
  }
}

function handleNewsClick(kind, index) {
  const item = (_newsData[kind] || [])[index];
  if (item) openItem(item);
}

function renderCards(items, kind) {
  const empty = kind === 'community' ? t('emptyCommunity') : t('emptyDlc');
  if (!items.length) return `<div class="empty-state">${empty}</div>`;
  const actionLabel = kind === 'community' ? t('play') : t('viewPack');
  const tagLabel = kind === 'community' ? t('tabCommunity') : 'DLC';
  return items.map((item, i) => `
    <div class="news-card ${kind}" style="animation-delay:${i * 0.07}s"
      onclick="handleNewsClick('${kind}', ${i})">
      <div class="news-header">
        <div class="news-icon">${esc(item.icon || '✦')}</div>
        <div class="news-meta">
          <div class="news-title">${esc(item.title)}</div>
          <div class="news-date-row">
            <span class="news-date">${formatDate(item.date)}</span>
            <span class="news-tag ${kind}">${esc(tagLabel)}</span>
            ${item.author ? `<span class="news-date">${esc(t('by'))} ${esc(item.author)}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="news-text">${esc(item.text)}</div>
      <div class="news-action">${actionLabel}</div>
    </div>
  `).join('');
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.news-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  document.querySelectorAll('.news-panel').forEach(el => {
    el.classList.toggle('active', el.id === 'panel-' + tab);
  });
}

function renderNews(data) {
  if (data.app_version) {
    document.getElementById('app-version').textContent = 'v' + data.app_version;
  }

  const community = sortByDate(data.community || []);
  const dlc = sortByDate(data.dlc || []);
  _newsData = { community, dlc };

  document.getElementById('list-community').innerHTML = renderCards(community, 'community');
  document.getElementById('list-dlc').innerHTML = renderCards(dlc, 'dlc');
  document.getElementById('community-cta').style.display = community.length ? 'block' : 'none';

  if (data.last_updated) {
    document.getElementById('footer-note').textContent =
      t('updated') + ' ' + formatDate(data.last_updated);
  }

  setTab(activeTab);
}

function showError() {
  const msg = `<div class="empty-state">✕<br><br>${t('error')}</div>`;
  document.getElementById('list-community').innerHTML = msg;
  document.getElementById('list-dlc').innerHTML = msg;
}

document.querySelectorAll('.news-tab').forEach(btn => {
  btn.addEventListener('click', () => setTab(btn.dataset.tab));
});

async function loadNews() {
  const urls = [`news_${lang}.json`, 'news.json'];
  for (const url of urls) {
    try {
      const r = await fetch(url);
      if (r.ok) { renderNews(await r.json()); return; }
    } catch (e) { continue; }
  }
  showError();
}

applyLang();
loadNews();
</script>
</body>
</html>
